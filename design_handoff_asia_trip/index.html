<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'DM Sans', system-ui, sans-serif; color: #1e1a17; }
  * { box-sizing: border-box; }

  /* shared tokens that variants will reference */
  :root {
    --paper-1: #f7f3ea;     /* warmest cream */
    --paper-2: #faf6ee;     /* editorial cream */
    --paper-3: #faf8f3;     /* wabi off-white */
    --ink: #1e1a17;
    --ink-2: #4a443d;
    --ink-3: #8a8278;
    --ink-4: #c9c2b6;
    --rule: #e7dfd0;
    --accent: #c8553d;      /* terracotta */
    --accent-deep: #9b3f2d;
    --accent-soft: #e8c4b5;
    --seal: #b0392a;        /* ink stamp red */
    --jade: #6d8a6f;        /* secondary accent only on V2 */
  }

  /* paper texture used by V1 + V2 (subtle, multiplied) */
  .paper-grain {
    background-image:
      radial-gradient(rgba(120,90,60,.05) 1px, transparent 1.2px),
      radial-gradient(rgba(80,50,30,.04) 1px, transparent 1.4px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
  }
</style>
</head>
