  <!-- Tier 2 body -->
  <rect x="11" y="21" width="10" height="3" fill="#1c1815"/>

  <!-- Tier 3 roof — upturned corners -->
  <polygon points="16,24  27.5,29  30,27  29.5,31  2.5,31  2,27  4.5,29" fill="#cf3a2a"/>

  <!-- Tier 3 body -->
