<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Spire -->
  <line x1="16" y1="1" x2="16" y2="5" stroke="#1c1815" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tier 1 roof — upturned corners -->
  <polygon points="16,5  19.5,9  21.5,7.5  21,11  11,11  10.5,7.5  12.5,9" fill="#cf3a2a"/>

  <!-- Tier 1 body -->
